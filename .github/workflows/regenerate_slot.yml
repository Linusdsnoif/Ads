name: Regenerate Slot

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which post to redo'
        required: true
        type: choice
        options: [sun, tue, thu, sat]
      batch_id:
        description: 'Batch id (Sunday date, e.g. 2026-10-11). Leave empty for the latest batch.'
        required: false
        default: ''
      caption_only:
        description: 'Keep the image, only rewrite the caption'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: regenerate-slot
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pillow google-genai tzdata

      - name: Regenerate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ARGS="--slot ${{ inputs.slot }}"
          if [ -n "${{ inputs.batch_id }}" ]; then ARGS="$ARGS --batch ${{ inputs.batch_id }}"; fi
          if [ "${{ inputs.caption_only }}" = "true" ]; then ARGS="$ARGS --caption-only"; fi
          python regenerate_helpers.py $ARGS
          python regenerate_helpers.py --list $( [ -n "${{ inputs.batch_id }}" ] && echo --batch ${{ inputs.batch_id }} )

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output_models/ output_descriptions/ output_schedule/
          git commit -m "Regenerated slot ${{ inputs.slot }} (awaiting review)" || { echo "No changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push rejected, retrying in 10s..."; sleep 10
          done
