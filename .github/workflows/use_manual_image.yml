name: Use Manual Image

# Runs when you upload a photo to manual_uploads/ (named like tue.jpg or 2026-11-08_tue.jpg).
# It crops the photo, writes the caption, attaches it to that slot and approves it.
on:
  push:
    branches: [main]
    paths:
      - 'manual_uploads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-image
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main   # the newest main, so a second upload sees what the first run did

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pillow google-genai tzdata

      - name: Attach photos to their slots
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python regenerate_helpers.py --scan-manual

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "__pycache__/" >> .git/info/exclude
          git add -A
          git commit -m "Attached manual photo(s)" || { echo "No changes"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push rejected (try $i of 5), retrying in 10s..."; sleep 10
          done
          echo "::error::Could not push after 5 tries, so these changes were NOT saved."
          exit 1