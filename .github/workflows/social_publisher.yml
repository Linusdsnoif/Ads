name: Weekly Product Generation

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pillow google-genai geopy timezonefinder tzdata

      - name: Run image & caption generation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python generate_product_images.py

      - name: Commit and push new files to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output_models/ output_descriptions/
          
          git commit -m "Auto-generated new products for the week" || echo "No changes to commit"
          
          git push